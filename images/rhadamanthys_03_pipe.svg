  <rect x="350" y="150" width="200" height="160" rx="6" fill="#111c2e" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="365" y="180" fill="#38bdf8" font-family="'Courier New', monospace" font-size="12" font-weight="bold">IPC NAMED PIPE</text>
  <text x="365" y="205" fill="#f8fafc" font-family="'Courier New', monospace" font-size="11">\\.\pipe\rhada_ipc_610</text>
  <text x="365" y="235" fill="#94a3b8" font-family="'Courier New', monospace" font-size="10">Flow: Bi-directional</text>
  <text x="365" y="255" fill="#94a3b8" font-family="'Courier New', monospace" font-size="10">Buffer: 64 KB Ring</text>
  <text x="365" y="275" fill="#4ade80" font-family="'Courier New', monospace" font-size="10">Cipher: RC4 (Key: SHA256)</text>

