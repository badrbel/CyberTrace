  <rect x="620" y="80" width="240" height="32" rx="6" fill="#172336"/>
  <text x="635" y="102" fill="#f43f5e" font-family="sans-serif" font-size="12" font-weight="bold">Target Client (chrome.exe)</text>

  <text x="635" y="140" fill="#94a3b8" font-family="'Courier New', monospace" font-size="11">PID: 8812 (Hooked)</text>
  <text x="635" y="165" fill="#cbd5e1" font-family="'Courier New', monospace" font-size="11">1. Connects to pipe handle</text>
  <rect x="635" y="185" width="210" height="45" rx="3" fill="#172233"/>
  <text x="645" y="205" fill="#facc15" font-family="'Courier New', monospace" font-size="10">CreateFileA(</text>
  <text x="645" y="220" fill="#38bdf8" font-family="'Courier New', monospace" font-size="9"> "\\.\pipe\rhada_ipc_610")</text>

  <text x="635" y="255" fill="#cbd5e1" font-family="'Courier New', monospace" font-size="11">2. Reads Cookies SQLite DB</text>
  <text x="635" y="280" fill="#cbd5e1" font-family="'Courier New', monospace" font-size="11">3. Dumps autofill passwords</text>
  <text x="635" y="305" fill="#4ade80" font-family="'Courier New', monospace" font-size="11">4. Pipes stream to dllhost</text>
  <text x="635" y="330" fill="#f43f5e" font-family="'Courier New', monospace" font-size="11">5. Detaches without alert</text>

  <!-- Bottom Diagnostic Bar -->
  <rect x="40" y="420" width="820" height="40" rx="4" fill="#090d14" stroke="#1f2c3d" stroke-width="1"/>
  <text x="60" y="445" fill="#94a3b8" font-family="'Courier New', monospace" font-size="11">ADVANTAGE: <tspan fill="#38bdf8">Chromium sandboxed process never makes direct external network requests, bypassing endpoint firewalls.</tspan></text>

