      <stop offset="0%" stop-color="#0a0f17"/>
      <stop offset="100%" stop-color="#141e2e"/>
    </linearGradient>
  </defs>

  <rect width="900" height="500" fill="url(#pipeBg)" stroke="#22334d" stroke-width="2"/>
  
  <!-- Header Bar -->
  <rect x="0" y="0" width="900" height="42" fill="#162235"/>
  <circle cx="22" cy="21" r="5.5" fill="#ef4444"/>
