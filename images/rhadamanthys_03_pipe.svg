  <text x="85" y="26" fill="#38bdf8" font-family="'Courier New', monospace" font-size="12" font-weight="bold">CHECK POINT RESEARCH // RHADAMANTHYS IPC NAMED PIPES &amp; MODULE SYNC</text>
