  <text x="752" y="25" fill="#38bdf8" font-family="'Courier New', monospace" font-size="10" font-weight="bold">STUB MODULE RPC</text>

  <!-- Process Box 1: Injected Process (e.g. dllhost.exe) -->
  <rect x="40" y="80" width="240" height="380" rx="6" fill="#0d1421" stroke="#2c3e59" stroke-width="1"/>
  <rect x="40" y="80" width="240" height="32" rx="6" fill="#172336"/>
  <text x="55" y="102" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="bold">Parent Host (dllhost.exe)</text>
  
  <text x="55" y="140" fill="#94a3b8" font-family="'Courier New', monospace" font-size="11">PID: 3412 (Medium IL)</text>
  <text x="55" y="165" fill="#cbd5e1" font-family="'Courier New', monospace" font-size="11">1. Drops stub loader in memory</text>
  <text x="55" y="190" fill="#cbd5e1" font-family="'Courier New', monospace" font-size="11">2. Allocates named pipe handle</text>
  <rect x="55" y="210" width="210" height="45" rx="3" fill="#172233"/>
  <text x="65" y="230" fill="#facc15" font-family="'Courier New', monospace" font-size="10">CreateNamedPipeA(</text>
  <text x="65" y="245" fill="#38bdf8" font-family="'Courier New', monospace" font-size="9"> "\\.\pipe\rhada_ipc_610")</text>

  <text x="55" y="280" fill="#94a3b8" font-family="'Courier New', monospace" font-size="11">3. Awaits child connection</text>
  <text x="55" y="305" fill="#4ade80" font-family="'Courier New', monospace" font-size="11">4. Relays stolen buffers</text>
  <text x="55" y="330" fill="#cbd5e1" font-family="'Courier New', monospace" font-size="11">5. C2 HTTPS Transmitter</text>

