    <line x1="280" y1="230" x2="350" y2="230"/>
    <line x1="550" y1="230" x2="620" y2="230"/>
  </g>
  <polygon points="350,230 340,225 340,235" fill="#38bdf8"/>
  <polygon points="620,230 610,225 610,235" fill="#38bdf8"/>

